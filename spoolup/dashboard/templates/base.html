<!doctype html>
<html>
<head>

  <title>SpoolUp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d99a4e' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3Cpath d='M12 3v6M12 15v6M3 12h6M15 12h6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // mark the active nav link based on the current path
    document.addEventListener("DOMContentLoaded", function () {
      var path = location.pathname === "/" ? "/" : "/" + location.pathname.split("/")[1];
      document.querySelectorAll("nav a.link").forEach(function (a) {
        if (a.getAttribute("href") === path) a.classList.add("active");
      });
    });
  </script>
</head>

<nav aria-label="Main">
  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

      <path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>

  </a>
  <a class="link" href="/">
