<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpoolUp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d99a4e' stroke-width='2'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3Cpath d='M12 3v6M12 15v6M3 12h6M15 12h6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script>
  // Single-page shell: panes switch client-side so heavy panes (Mainsail
  // iframe) initialize once and stay alive while hidden.
  (function () {
    var HREF_TO_PANE = {
      "/": "dashboard", "/printer": "printer", "/music": "music",
      "/settings": "settings", "/logs": "logs"
    };
    var PANE_TO_HREF = {};
    Object.keys(HREF_TO_PANE).forEach(function (h) { PANE_TO_HREF[HREF_TO_PANE[h]] = h; });

    function showPane(name, push) {
      var panes = document.querySelectorAll(".pane");
      var exists = false;
      panes.forEach(function (p) {
        var isTarget = p.dataset.pane === name;
        p.hidden = !isTarget;
        if (isTarget) exists = true;
      });
      document.querySelectorAll("nav a.link").forEach(function (a) {
        a.classList.toggle("active",
            a.dataset.paneNav === name);
      });
      if (!exists) return;
      if (name === "printer") initMainsail();
      if (push && PANE_TO_HREF[name]) history.pushState({}, "", PANE_TO_HREF[name]);
    }

    function initMainsail() {
      var f = document.getElementById("mainsail-iframe");
      if (f && !f.getAttribute("src") && f.dataset.src) f.src = f.dataset.src;
    }

    document.addEventListener("click", function (e) {
      var link = e.target.closest && e.target.closest("nav a[data-pane-nav]");
      if (!link) return;
      var pane = link.dataset.paneNav;
      var paneEl = document.querySelector('.pane[data-pane="' + pane + '"]');
      if (!paneEl) return; // wizard page etc. — follow the link
      e.preventDefault();
      showPane(pane, true);
    });

    window.addEventListener("popstate", function () {
      var pane = HREF_TO_PANE[location.pathname] || "dashboard";
      showPane(pane, false);
    });

    document.addEventListener("DOMContentLoaded", function () {
      var initial = document.querySelector(".pane:not([hidden])");
      var name = initial ? initial.dataset.pane : "dashboard";
      if (name !== "dashboard") showPane(name, false);
      // activate nav link for the initial pane
      document.querySelectorAll("nav a.link").forEach(function (a) {
        a.classList.toggle("active", a.dataset.paneNav === name);
      });
      if (name === "printer") initMainsail();
    });
  })();
  </script>
</head>
<body>
<nav aria-label="Main">
  <a class="brand" href="/" data-pane-nav="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>
      <path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>
    </svg>
    SpoolUp
  </a>
  <a class="link" href="/" data-pane-nav="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    Dashboard
  </a>
  <a class="link" href="/printer" data-pane-nav="printer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/></svg>
    Printer
  </a>
  <a class="link" href="/music" data-pane-nav="music">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    Music
  </a>
  <a class="link" href="/settings" data-pane-nav="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.02a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.02a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Settings
  </a>
  <a class="link" href="/logs" data-pane-nav="logs">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v12H4z"/><path d="M8 20h8M12 16v4"/></svg>
    Logs
  </a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/dashboard.js"></script>
</body>
</html>
