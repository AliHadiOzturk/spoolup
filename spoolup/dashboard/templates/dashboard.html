<h1>Dashboard</h1>
<div id="banners"></div>
<div class="grid">
  <div class="card col-7" id="stream-card">
    <div class="card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16v12H4z"/><path d="M8 20h8M12 16v4"/></svg>
      Stream
    </div>
    <div class="skeleton" aria-hidden="true">loading</div>
  </div>
  <div class="card col-5" id="print-card">
    <div class="card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 17h12v4H6z"/></svg>
      Print
    </div>
    <div class="skeleton" aria-hidden="true">loading</div>
  </div>
  <div class="card col-8" id="sessions-card">
    <div class="card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      Recent prints
    </div>
    <div class="skeleton" aria-hidden="true">loading</div>
  </div>
  <div class="card col-4" id="updates-card">
    <div class="card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Updates
    </div>
    <div class="skeleton" aria-hidden="true">loading</div>
    <div class="actions">
      <button class="ghost" id="btn-check">Check now</button>
      <button class="primary" id="btn-update">Update now</button>
    </div>
  </div>
</div>
<div class="actions">
  <button class="primary" data-action="stream/start">Start stream</button>
  <button class="ghost" data-action="stream/stop">Stop stream</button>
  <button class="ghost" data-action="stream/restart">Restart stream</button>
</div>
