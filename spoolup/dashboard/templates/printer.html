{% extends "base.html" %}
{% block content %}
<h1>Printer</h1>
{% if mainsail_url %}
<iframe src="{{ mainsail_url }}" style="width:100%;height:80vh;border:0;border-radius:10px;"></iframe>
{% else %}
<div class="card">Set <code>mainsail_url</code> in Settings to embed Mainsail here (e.g. http://192.168.1.115:4408).</div>
{% endif %}
{% endblock %}
