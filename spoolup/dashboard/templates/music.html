{% extends "base.html" %}
{% block content %}
<h1>Music</h1>
<div class="grid">
  <div class="card">
    <h3>Now playing</h3>
    <div id="now-playing">…</div>
    <label>Volume</label>
    <input type="range" id="volume" min="0" max="1.5" step="0.05">
    <div class="actions">
      <button id="src-silence">Silence</button>
      <button id="src-library">Library playlist</button>
      <button id="src-spotify">Spotify</button>
    </div>
  </div>
  <div class="card">
    <h3>Library</h3>
    <input type="file" id="upload" accept=".mp3,.wav,.m4a,.ogg,.flac">
    <ul id="tracks"></ul>
    <p class="hint">Spotify needs librespot installed; set librespot_path,
    spotify_username, spotify_password in Settings, then press "Spotify"
    above and choose the "SpoolUp" device in your Spotify app.</p>
  </div>
</div>
<script src="/static/music.js"></script>
{% endblock %}
