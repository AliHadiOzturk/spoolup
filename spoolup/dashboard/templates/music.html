<h1>Music</h1>
<div class="grid">
  <div class="card col-5">
    <div class="card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Now playing
    </div>
    <div id="now-playing" class="rows skeleton" aria-hidden="true">loading</div>
    <label style="margin-top:16px">Volume</label>
    <input type="range" id="volume" min="0" max="1.5" step="0.05" aria-label="Volume">
    <div class="actions">
      <button class="ghost" id="src-silence">Silence</button>
      <button class="primary" id="src-library">Library</button>
      <button class="ghost" id="src-spotify">Spotify</button>
    </div>
  </div>
  <div class="card col-7">
    <div class="card-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8"/></svg>
      Library
    </div>
    <input type="file" id="upload" accept=".mp3,.wav,.m4a,.ogg,.flac">
    <div id="tracks" class="list" style="margin-top:12px">
      <div class="empty">No tracks yet — upload an mp3 to get started.</div>
    </div>
    <p class="hint" style="margin-top:14px">Spotify needs librespot: set librespot_path, spotify_username and spotify_password in Settings, press Spotify above, then pick the “SpoolUp” device in your Spotify app.</p>
  </div>
</div>
<script src="/static/music.js"></script>
